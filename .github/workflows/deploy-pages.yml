# Release: Tag v* pushen -> alle Tests (offline, immer gleich) -> nur wenn grün:
#   1. WG-Server (Cloudflare Worker «bringfrisch») hochladen   (braucht Secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
#   2. danach die App auf GitHub Pages veröffentlichen          (Server zuerst: neue App findet immer schon den neuen Server)
# Zurück zur alten Server-Version: cd worker && npx wrangler rollback
# Ein normaler Push auf main veröffentlicht nichts. Lokal dasselbe: cd tests && npm ci && npm run ci
name: Release BringFrisch (Tests + WG-Server + GitHub Pages)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Europe/Zurich
      BROWSER: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: All tests (Syntax, App, Integration, Worker, Layout, UI)
        working-directory: tests
        run: npm run ci -- --shots
      - name: Upload screenshots (Layout + UI)
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-shots
          path: tests/shots/
          if-no-files-found: ignore

  worker:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt – WG-Server NICHT aktualisiert. Von Hand – cd worker && npx wrangler deploy"
      - name: WG-Server hochladen (Worker bringfrisch)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx --yes wrangler@4.159.0 deploy
      - name: WG-Server prüfen (/health)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl -fsS --retry 3 --retry-delay 5 https://bringfrisch.bringfrisch-worker.workers.dev/health

  deploy:
    needs: [test, worker]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      # Gleiche Adressen wie früher (Branch-Pages): Root-index.html leitet auf static/ weiter.
      # Installierte Homescreen-Apps zeigen auf /BringFresch/static/ und müssen weiter funktionieren.
      - name: Build site (index.html + static/)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r static _site/static
          # Version in der App = Release-Tag (v1.5.0 -> 1.5.0), damit «Aktualisieren» die neue Version erkennt
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # nur die Zeile mit der Deklaration (sonst trifft es auch das Suchmuster in «Aktualisieren» -> Syntaxfehler)
            sed -i -E "s/^([[:space:]]*)const APP_VERSION = \"[^\"]*\";/\1const APP_VERSION = \"${GITHUB_REF_NAME#v}\";/" _site/static/app.js
            test "$(grep -c "const APP_VERSION = \"${GITHUB_REF_NAME#v}\";" _site/static/app.js)" = 1
          fi
          # was veröffentlicht wird, muss gültiges JavaScript sein
          for f in _site/static/*.js; do node --check "$f"; done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
