name = "bringfrisch"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Name der ersten WG (beim ersten Start in der App eingeben, mit dem bisherigen WG-PIN).
# Weitere WGs: node tools/new_wg.mjs (eigener Name + PIN, eigene Daten, eigene Bring!-Liste).
[vars]
MAIN_WG = "wg1"

# Tägliche Sicherung der WG-Daten (03:00 UTC), siehe README «Sicherung»
[triggers]
crons = ["0 3 * * *"]

# Gemeinsamer WG-Speicher (Wochenwahl, Plan für den Kalender).
# Einmalig anlegen: npx wrangler kv namespace create WG  -> die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "WG"
id = "477e6573755e423fba0e3e8410fbb8cc"

# Secrets (nicht hier eintragen!):
#   npx wrangler secret put BRING_EMAIL      # E-Mail des Bring!-Bot-Kontos
#   npx wrangler secret put BRING_PASSWORD   # Passwort des Bot-Kontos
#   npx wrangler secret put WG_PIN           # PIN, den alle in der App eingeben
#   npx wrangler secret put CAL_TOKEN        # langer Zufallstext für den Kalender-Link
# Optional: BRING_LIST_UUID (sonst Standardliste des Bot-Kontos)

# ---------------------------------------------------------------------------
# Test-Version (ein Worker für Test-Seite UND Test-Server, gleiche Adresse):
#   node tools/build_stage.mjs && cd worker && npx wrangler deploy --env stage
#   -> https://bringfrisch-test.bringfrisch-worker.workers.dev
# Dateien aus dist-stage/ werden direkt ausgeliefert, alles andere (/plan, /bring/…) beantwortet der Worker.
# Eigener Speicher, schreibt NUR in die Bring!-Liste «Home» des Bots (nie in die WG-Liste).
# Secrets einmalig: powershell -ExecutionPolicy Bypass -File worker\setup-stage.ps1
[env.stage]
name = "bringfrisch-test"
vars = { ONLY_LIST_NAME = "Home", MAIN_WG = "test" }
assets = { directory = "../dist-stage" }

[[env.stage.kv_namespaces]]
binding = "WG"
id = "48eef0faf2ce4bd3bb74fed8f4cfe31f"
