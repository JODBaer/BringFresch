name = "bringfrisch"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Gemeinsamer WG-Speicher (Wochenwahl, Plan für den Kalender).
# Einmalig anlegen: npx wrangler kv namespace create WG  -> die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "WG"
id = "REPLACE_WITH_KV_ID"

# Secrets (nicht hier eintragen!):
#   npx wrangler secret put BRING_EMAIL      # E-Mail des Bring!-Bot-Kontos
#   npx wrangler secret put BRING_PASSWORD   # Passwort des Bot-Kontos
#   npx wrangler secret put WG_PIN           # PIN, den alle in der App eingeben
#   npx wrangler secret put CAL_TOKEN        # langer Zufallstext für den Kalender-Link
# Optional: BRING_LIST_UUID (sonst Standardliste des Bot-Kontos)
