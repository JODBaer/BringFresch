<div class="page">

<script>
const $ = id => document.getElementById(id);
const DAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const SECS = [
  { k: "einfach", t: "Einfach im November", n: 9, items: [["Hörnli & Ghacktes", "🍝", 1], ["Gnocchi aus der Pfanne", "🥔", 1], ["Ofengemüse", "🥕", 1], ["Poulet-Curry", "🍛", 1], ["Poulet-Rahmsauce", "🍲", 1], ["Gemüsepfanne", "🥢", 1], ["Café complet", "☕", 1], ["Arme Ritter", "🍞", 1], ["Käseschnitte", "🧀", 1]] },
  { k: "eigene", t: "Eigene", n: 3, items: [["Omas Älplermagronen", "🧀", 0], ["Linsen-Dal", "🍛", 1], ["Pizza vom Blech", "🍕", 0]] },
  { k: "swissmilk", t: "Swissmilk", n: 41, items: [["Kürbisrisotto", "🎃", 0], ["Kartoffelgratin", "🥔", "> 1 h"], ["Lauchwähe", "🥧", 0], ["Randen-Salat", "🥗", 1], ["Rösti mit Spiegelei", "🍳", 1], ["Käsesuppe", "🥣", 0]] },
  { k: "fooby", t: "Fooby", n: 38, items: [] }, { k: "bb", t: "Betty Bossi", n: 52, items: [] }, { k: "migusto", t: "Migusto", n: 44, items: [] },
  { k: "schnell", t: "Schnelles & Reste", n: 13, items: [] },
];
// Add-on «Saison»: dasselbe Rezept, das Gemüse/Obst vom Monat kommt dazu (im Plan änderbar). Keine eigenen Karten pro Gemüse.
// Für die Sortierung: Hauptgemüse, Protein (g), aktive Min., Saison jetzt (1/0)
const META = { "Hörnli & Ghacktes": ["Lauch", 34, 20, 1], "Gnocchi aus der Pfanne": ["Rosenkohl", 14, 15, 1], "Ofengemüse": ["Kürbis", 12, 15, 1], "Poulet-Curry": ["Kürbis", 38, 25, 1], "Poulet-Rahmsauce": ["Champignons", 36, 20, 1], "Gemüsepfanne": ["Rüebli", 11, 20, 1], "Café complet": ["Äpfel", 18, 10, 1], "Arme Ritter": ["Äpfel", 15, 15, 1], "Käseschnitte": ["Lauch", 24, 10, 1],
  "Omas Älplermagronen": ["Kartoffeln", 22, 35, 1], "Linsen-Dal": ["Rüebli", 19, 20, 1], "Pizza vom Blech": ["Peperoni", 20, 30, 0], "Kürbisrisotto": ["Kürbis", 13, 40, 1], "Kartoffelgratin": ["Kartoffeln", 15, 75, 1], "Lauchwähe": ["Lauch", 17, 35, 1], "Randen-Salat": ["Randen", 9, 15, 1], "Rösti mit Spiegelei": ["Kartoffeln", 21, 25, 1], "Käsesuppe": ["Zwiebeln", 23, 30, 0] };
const SORTS = [["herkunft", "Herkunft"], ["az", "A–Z"], ["saison", "Saison"], ["schnell", "Schnell"], ["protein", "💪 Protein"], ["gemuese", "🥬 Hauptgemüse"]];
let sort = "herkunft";
try { sort = localStorage.getItem("rv_sort") || sort; } catch (e) {}
function sections() {
  if (sort === "herkunft") return SECS;
  const all = SECS.flatMap(x => x.items).filter(([t]) => META[t]);
  const by = (k, f) => { const m = new Map(); all.forEach(it => { const g = f(it); m.has(g) || m.set(g, []); m.get(g).push(it); }); return [...m].map(([t, items]) => ({ k: k + t, t, n: items.length, items })); };
  const M = t => META[t[0]];
  if (sort === "az") return [{ k: "az", t: "Alle A–Z", n: all.length, items: [...all].sort((a, b) => a[0].localeCompare(b[0], "de")) }];
  if (sort === "protein") return [{ k: "pr", t: "Proteinreichste zuerst", n: all.length, items: [...all].sort((a, b) => M(b)[1] - M(a)[1]) }];
  if (sort === "saison") return by("sa", it => M(it)[3] ? "Jetzt Saison" : "Gerade nicht Saison").sort((a, b) => a.t < b.t ? -1 : 1);
  if (sort === "schnell") { const order = ["≤ 15 Min. aktiv", "≤ 30 Min. aktiv", "länger"]; return by("sc", it => M(it)[2] <= 15 ? order[0] : M(it)[2] <= 30 ? order[1] : order[2]).sort((a, b) => order.indexOf(a.t) - order.indexOf(b.t)); }
  return by("ge", it => M(it)[0]).sort((a, b) => b.n - a.n || a.t.localeCompare(b.t, "de"));
}
const ADDON = { "Hörnli & Ghacktes": "+ Lauch", "Gnocchi aus der Pfanne": "+ Rosenkohl", "Ofengemüse": "+ Kürbis & Randen", "Poulet-Curry": "+ Kürbis", "Poulet-Rahmsauce": "+ Champignons", "Gemüsepfanne": "+ Rüebli & Lauch", "Café complet": "+ Äpfel & Birnen", "Arme Ritter": "+ Apfelkompott", "Käseschnitte": "+ Lauch", "Lauchwähe": "+ Speck (Fleisch)", "Kürbisrisotto": "+ Salbei-Butter" };
let tab = "rez", open = { einfach: 1, eigene: 0, swissmilk: 1 }, flipped = null, addOpen = false, more = {};
let plan = [["Hörnli & Ghacktes mit Lauch", "Joshua, Lukas, Leonie, Jo"], ["Kürbis-Curry mit Reis", "alle"], ["Gnocchi mit Rosenkohl", "alle ausser Jo"], ["Käseschnitte mit Pilzen", "alle"], ["Ofengemüse Kürbis & Randen", "alle"], ["Lauchwähe", "Lukas, Leonie"], ["Café complet mit Äpfeln", "alle"]];
let expanded = 0, lift = null, over = null;
const members = [{ n: "Joshua", d: "f", g: ["p"] }, { n: "Lukas", d: "f", g: [] }, { n: "Leonie", d: "f", g: ["k"] }, { n: "Jo", d: "v", g: ["p"] }];
let editing = null, ki = "ChatGPT";

const SIDE = {
  rez: `<div class="box now"><h2>Rezepte = wie «Alle Rezepte»</h2><ul>
      <li>Ein Reiter, eine Ansicht: <b>3 Karten pro Zeile</b>, wie heute in «Alle Rezepte».</li>
      <li>Abschnitte <b>ausklappbar</b>: Einfach im November (offen), Eigene, Swissmilk, Fooby … Antippen = auf/zu.</li>
      <li>Karte antippen = umdrehen, Tag antippen = einplanen (wie heute).</li>
      <li><b>Rezepte bleiben Rezepte</b>: «Hörnli &amp; Ghacktes» ist eine Karte, nicht fünf. Saisonal wird es durch ein <b>Add-on</b> (🥬 + Lauch im November), das sich jeden Monat selbst wählt und im Plan änderbar ist. Alle Rezepte haben denselben Aufbau.</li>
      <li>Oben immer sichtbar: Suche und <b>«+ Einfügen»</b>.</li>
      <li><b>Ordnen ⇅</b> als Dropdown neben der Suche: Herkunft · A–Z · Saison · Schnell · 💪 Protein · 🥬 Hauptgemüse. Die Abschnitte richten sich danach (z.B. «Kürbis», «Lauch» …). Die Wahl bleibt gemerkt (pro Handy).</li>
      <li>Pro Abschnitt <b>6 Karten</b>, darunter «Alle 41 zeigen».</li>
      <li>«+ Einfügen»: oben direkt das <b>Link-Feld</b> (einfügen, «Holen»), mit kurzer Anleitung. Darunter <b>Rezept suchen bei</b> Fooby · Swissmilk · Betty Bossi · Migusto (öffnet die Seite, Link teilen, zurück). Dann Text · <b>Foto mit KI</b> · Von Hand, je mit einem Satz, wie es geht. Foto mit KI kommt mit Schritt 5.</li>
      <li>«Rezept suchen», «Rezepte holen» und die Saison-Liste wandern nach unten bzw. ins «+».</li></ul></div>`,
  plan: `<div class="box now"><h2>Plan: antippen und verschieben</h2><ul>
      <li><b>Rezept antippen</b> = Tag klappt auf, genau wie beim Tag selbst.</li>
      <li><b>Lange drücken</b> = Karte hebt sich und wackelt (wie Apps auf dem iPhone-Homescreen).</li>
      <li><b>Ziehen</b> auf einen anderen Tag = die zwei Gerichte tauschen. Esser und Gäste bleiben am Tag.</li>
      <li>Loslassen ausserhalb = nichts passiert. Danach 6 s «Rückgängig».</li></ul>
      <small>Im Entwurf: lange drücken (oder mit der Maus gedrückt halten), dann auf einen anderen Tag ziehen.</small></div>`,
  set: `<div class="box now"><h2>Einstellungen: alle auf einer Liste</h2><ul>
      <li>Alle Mitbewohner untereinander, eine Zeile pro Person.</li>
      <li>Daneben <b>Bubbles mit Piktogrammen</b>: 🥩 Fleisch · 🥦 Vegi · 🌱 Vegan, dann 💪 proteinreich · 🪶 leicht. Antippen = an/aus.</li>
      <li><b>Namen antippen</b> = umbenennen oder entfernen.</li>
      <li>«+ Mitbewohner» unten in der Liste.</li>
      <li><b>Lieblings-KI</b> unter «Du»: ChatGPT · Claude · Gemini · andere (pro Handy).</li></ul></div>`,
};

function render() {
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  $("side").innerHTML = SIDE[tab];
  const S = $("scr");
  if (tab === "rez") {
    S.innerHTML = `<div class="ttl"><h2>Rezepte</h2><button class="plus" type="button" id="add">+ Einfügen</button></div>
      ${addOpen ? `<div class="sheet">
        <div class="full"><div class="linkrow"><input type="url" placeholder="Link einfügen: fooby.ch/…, instagram.com/…" aria-label="Rezept-Link"><button type="button">Holen</button></div></div>
        <p class="how full">Auf der Rezeptseite oder in Instagram «Teilen» → «Link kopieren» → hier einfügen. Obsonare holt Titel, Zutaten und Zeit.</p>
        <div class="full"><p class="how" style="margin-bottom:5px">Rezept suchen bei:</p><div class="sites"><a href="https://fooby.ch/de/rezepte.html" target="_blank" rel="noopener">Fooby ↗</a><a href="https://www.swissmilk.ch/de/rezepte-kochideen/" target="_blank" rel="noopener">Swissmilk ↗</a><a href="https://www.bettybossi.ch/de/rezepte/" target="_blank" rel="noopener">Betty Bossi ↗</a><a href="https://migusto.migros.ch/de/rezepte" target="_blank" rel="noopener">Migusto ↗</a></div></div>
        <button type="button"><span aria-hidden="true">📋</span>Text<small>aus WhatsApp oder Notiz kopieren und einfügen</small></button><button type="button"><span aria-hidden="true">📷</span>Foto mit KI<small>Prompt wird kopiert, ${ki} öffnet sich, Antwort zurück einfügen</small></button><button type="button" class="full"><span aria-hidden="true">✍️</span>Von Hand<small>Titel, Zutaten, Zeit selbst eintragen</small></button></div>` : ""}
      <div class="sorts"><input class="search" type="search" id="q" placeholder="Suchen: Titel oder Zutat" aria-label="Rezepte durchsuchen">
      <label class="ord"><span aria-hidden="true">⇅</span><select id="ord" aria-label="Ordnen nach">${SORTS.map(([k, l]) => `<option value="${k}"${sort === k ? " selected" : ""}>${l}</option>`).join("")}</select></label></div>
      ${sections().map(s => `<div class="sec" data-open="${(open[s.k] ?? sort !== "herkunft") ? 1 : 0}"><button type="button" data-sec="${s.k}">${s.t} <small>${s.n}</small><i aria-hidden="true">›</i></button>
        ${(open[s.k] ?? sort !== "herkunft") ? `<div class="grid3">${(s.items.length ? s.items : [["Beispiel", "🍽️", 0], ["Beispiel", "🍽️", 0], ["Beispiel", "🍽️", 0]]).slice(0, more[s.k] ? 99 : 6).map(([t, e, k], i) => {
          const id = s.k + i;
          return flipped === id
            ? `<button class="card back" type="button" data-card="${id}"><b>${t}</b><small>6 Zutaten · 25 Min.</small>${ADDON[t] ? `<span class="addon">🥬 ${ADDON[t]}</span>` : ""}<span class="mini7">${DAYS.map(d => `<span>${d}</span>`).join("")}</span></button>`
            : `<button class="card" type="button" data-card="${id}"><span class="e" aria-hidden="true">${e}</span>${k === 1 ? '<span class="tag">einfach</span>' : typeof k === "string" ? `<span class="tag t">${k}</span>` : ""}${sort === "protein" && META[t] ? `<span class="tag p">${META[t][1]} g</span>` : sort === "schnell" && META[t] ? `<span class="tag p">${META[t][2]}′</span>` : ""}<b>${t}</b></button>`;
        }).join("")}${s.n > 6 && !more[s.k] ? `<button class="more" type="button" data-more="${s.k}">Alle ${s.n} zeigen</button>` : ""}</div>` : ""}</div>`).join("")}`;
  } else if (tab === "plan") {
    S.innerHTML = `<div class="ttl"><h2>KW 48</h2></div><p class="hint">Antippen = aufklappen · lange drücken = verschieben</p>
      ${plan.map(([t, e], i) => `<div class="day${lift === i ? " lift" : ""}${over === i && lift !== i ? " over" : ""}" data-day="${i}">
        <span class="d">${DAYS[i]}</span><span class="t">${t}</span><span class="n">${e === "alle" ? "4" : e.split(",").length}</span>
        ${expanded === i && lift === null ? `<span class="ing">400 g Hörnli · 1 Stange Lauch · 400 g Ghacktes · 1 Glas Apfelmus …<br>Esser: ${e}</span>` : ""}</div>`).join("")}`;
  } else {
    S.innerHTML = `<div class="ttl"><h2>Einstellungen</h2></div>
      <p class="label" style="margin:0;font-weight:800">WG allmen · Mitbewohner</p>
      <div class="mlist">${members.map((m, i) => `<div class="mrow"><span class="av">${m.n.slice(0, 2)}</span><button class="nm" type="button" data-edit="${i}">${m.n}</button>
        <span class="bub">${[["f", "🥩", "Fleisch"], ["v", "🥦", "Vegi"], ["g", "🌱", "Vegan"]].map(([k, ic, l]) => `<button type="button" data-diet="${i}:${k}" aria-pressed="${m.d === k}" aria-label="${l}" title="${l}">${ic}</button>`).join("")}<span class="sep"></span>${[["p", "💪", "proteinreich"], ["k", "🪶", "leicht"]].map(([k, ic, l]) => `<button type="button" data-goal="${i}:${k}" aria-pressed="${m.g.includes(k)}" aria-label="${l}" title="${l}">${ic}</button>`).join("")}</span></div>
        ${editing === i ? `<div class="edit" style="margin:0 10px 10px"><input id="nm" value="${m.n}" aria-label="Name"><div class="row2"><button type="button" id="save">Speichern</button><button type="button" id="del">Entfernen</button></div></div>` : ""}`).join("")}
        <div class="mrow"><span class="av">+</span><button class="nm" type="button" style="color:var(--accent)">Mitbewohner hinzufügen</button><span></span></div></div>
      <p class="label" style="margin:6px 0 0;font-weight:800">Du · Lieblings-KI</p>
      <div class="kis" role="group" aria-label="Lieblings-KI">${["ChatGPT", "Claude", "Gemini", "andere"].map(k => `<button type="button" data-ki="${k}" aria-pressed="${ki === k}">${k}</button>`).join("")}</div>
      <p class="hint">Für «Foto mit KI», Instagram und Reste-Rezepte. Obsonare kopiert den Prompt und öffnet diese App.</p>
      <p class="legend"><span>🥩 Fleisch</span><span>🥦 Vegi</span><span>🌱 Vegan</span><span>💪 proteinreich</span><span>🪶 leicht</span></p>`;
  }
}

document.querySelector(".nav").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; render(); } });
$("scr").addEventListener("change", e => {
  if (e.target.id !== "ord") return;
  sort = e.target.value; try { localStorage.setItem("rv_sort", sort); } catch (err) {}
  render();
});
$("scr").addEventListener("click", e => {
  const t = e.target.closest("button, .day");
  if (!t) return;
  if (t.id === "add") addOpen = !addOpen;
  else if (t.dataset.more) more[t.dataset.more] = 1;
  else if (t.dataset.sort) { sort = t.dataset.sort; try { localStorage.setItem("rv_sort", sort); } catch (e) {} }
  else if (t.dataset.sec) open[t.dataset.sec] = !(open[t.dataset.sec] ?? sort !== "herkunft");
  else if (t.dataset.card) flipped = flipped === t.dataset.card ? null : t.dataset.card;
  else if (t.dataset.diet) { const [i, k] = t.dataset.diet.split(":"); members[i].d = k; }
  else if (t.dataset.goal) { const [i, k] = t.dataset.goal.split(":"); const g = members[i].g; g.includes(k) ? g.splice(g.indexOf(k), 1) : g.push(k); }
  else if (t.dataset.ki) ki = t.dataset.ki;
  else if (t.dataset.edit) editing = editing === +t.dataset.edit ? null : +t.dataset.edit;
  else if (t.id === "save") { members[editing].n = $("nm").value.trim() || members[editing].n; editing = null; }
  else if (t.id === "del") { members.splice(editing, 1); editing = null; }
  else if (t.classList.contains("day") && !moved) expanded = expanded === +t.dataset.day ? null : +t.dataset.day;
  else return;
  render();
});

// Plan: lange drücken = heben, ziehen = auf anderen Tag, loslassen = tauschen
let timer = null, moved = false;
$("scr").addEventListener("pointerdown", e => {
  const d = e.target.closest(".day"); if (!d) return;
  moved = false;
  timer = setTimeout(() => { lift = +d.dataset.day; over = lift; render(); }, 450);
});
$("scr").addEventListener("pointermove", e => {
  if (lift === null) return;
  moved = true;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const d = el && el.closest(".day");
  const o = d ? +d.dataset.day : null;
  if (o !== over) { over = o; render(); }
});
const end = () => {
  clearTimeout(timer);
  if (lift !== null) {
    if (over !== null && over !== lift) { [plan[lift][0], plan[over][0]] = [plan[over][0], plan[lift][0]]; }
    lift = null; over = null; render();
    setTimeout(() => { moved = false; }, 50);
  }
};
$("scr").addEventListener("pointerup", end);
$("scr").addEventListener("pointercancel", end);
render();
</script>
