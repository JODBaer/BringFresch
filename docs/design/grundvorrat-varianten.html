<title>Grundvorrat Varianten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f3f7ef; --fg: #172116; --muted: #4d5d47; --card: #ffffff; --line: #d3e0c9;
  --accent: #3a5f3a; --accent-bg: #c8f6c8; --on-accent: #ffffff; --focus: #1a73e8; --new: #fff3b0;
  --font: "Roboto Flex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e130e; --fg: #e2ecdc; --muted: #a9bba0; --card: #182018; --line: #2f3c2d;
    --accent: #90ee90; --accent-bg: #3a5f3a; --on-accent: #1d301d; --focus: #8ab4ff; --new: #4a4418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e130e; --fg: #e2ecdc; --muted: #a9bba0; --card: #182018; --line: #2f3c2d;
  --accent: #90ee90; --accent-bg: #3a5f3a; --on-accent: #1d301d; --focus: #8ab4ff; --new: #4a4418;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; overflow-x: hidden; }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.page { max-width: 1120px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.top h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.01em; }
.top h1 span { color: var(--accent); }
.top p { margin: 0 0 14px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 20px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); gap: 2px; }
.seg button { border: 0; background: none; color: var(--fg); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.stage { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.phonewrap { width: 100%; max-width: 390px; justify-self: center; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.box h2 { font-size: 18px; margin: 0 0 6px; }
.box h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
.box p { margin: 4px 0; }
.box ul { margin: 4px 0; padding-left: 20px; }
.box li { margin: 3px 0; }
.qa { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 0; }
.qa dt { color: var(--muted); }
.qa dd { margin: 0; }
.pro b { color: var(--accent); }
.try { background: var(--accent-bg); border-radius: 12px; padding: 8px 12px; margin-top: 12px !important; }
.bringbox .bh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.bringbox .count { font-weight: 700; color: var(--accent); }
.bringbox ul { list-style: none; padding: 0; margin: 8px 0 0; }
.bringbox li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.bringbox li.new { animation: newrow 2.4s ease-out; }
@keyframes newrow { 0%, 40% { background: var(--new); } 100% { background: transparent; } }
.bringbox li .n { flex: 1; min-width: 0; }
.bringbox li small { color: var(--muted); display: block; font-size: 12px; }
.bringbox li .by { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); white-space: nowrap; }
.bringbox li button { border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.bringbox .log { color: var(--muted); font-size: 13px; min-height: 1.4em; }
.muted { color: var(--muted); font-size: 13px; }
.reset { align-self: flex-start; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 7px 14px; cursor: pointer; }

/* ---------------- Handy ---------------- */
.phone { width: 100%; height: 844px; max-height: calc(100svh - 24px); min-height: 560px; border-radius: 52px; padding: 11px; background: #0d0f0d; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), inset 0 0 0 2px #333; font-family: var(--font); }
.screen { position: relative; height: 100%; border-radius: 42px; overflow: hidden; display: flex; flex-direction: column; color: var(--p-fg); font-size: 15px; }
@media (max-width: 440px) {
  .phone { padding: 0; background: none; box-shadow: none; border-radius: 24px; border: 1px solid var(--line); }
  .screen { border-radius: 23px; }
}
/* iPhone: Glas */
.phone.ios {
  --p-fg: #10170f; --p-fg2: rgba(16,23,15,.68); --card: rgba(255,255,255,.52); --card2: rgba(250,255,248,.82); --rim: rgba(255,255,255,.95);
  --line: rgba(16,23,15,.14); --pri: #3a5f3a; --on-pri: #eefcee; --ton: rgba(147,197,114,.45); --on-ton: #1d301d;
  --leer: #3a5f3a; --leer-bg: rgba(144,238,144,.6); --on-leer: #1d301d; --danger: #ba1a1a; --ring: #1a73e8; --warn: #7a4b00;
  --r-out: 22px; --r-in: 10px; --pill-bg: rgba(255,255,255,.55); --snack: #233123; --on-snack: #eefcee; --snack-act: #90ee90;
  --mesh: radial-gradient(60% 45% at 12% 8%, #c8f6c8 0%, transparent 70%), radial-gradient(55% 40% at 95% 22%, #e3f1cc 0%, transparent 70%), radial-gradient(70% 45% at 18% 78%, #d4f7e3 0%, transparent 70%), radial-gradient(60% 40% at 92% 92%, #cfe8b2 0%, transparent 70%), linear-gradient(#effbec, #f6faee);
}
.phone.ios.dark {
  --p-fg: #f1f5ee; --p-fg2: rgba(241,245,238,.72); --card: rgba(18,26,20,.5); --card2: rgba(20,30,22,.86); --rim: rgba(255,255,255,.16);
  --line: rgba(255,255,255,.16); --pri: #90ee90; --on-pri: #1d301d; --ton: rgba(147,197,114,.28); --on-ton: #eefcee;
  --leer: #90ee90; --leer-bg: rgba(58,95,58,.75); --on-leer: #eefcee; --danger: #ffb4ab; --ring: #8ab4ff; --warn: #ffcf8a;
  --pill-bg: rgba(18,26,20,.4); --snack: #dfe9da; --on-snack: #1d301d; --snack-act: #3a5f3a;
  --mesh: radial-gradient(60% 45% at 12% 8%, #24452a 0%, transparent 70%), radial-gradient(55% 40% at 95% 22%, #34441f 0%, transparent 70%), radial-gradient(70% 45% at 18% 78%, #173a31 0%, transparent 70%), radial-gradient(60% 40% at 92% 92%, #2f4520 0%, transparent 70%), linear-gradient(#0e1610, #121610);
}
.phone.ios .screen { background: var(--mesh); }
.phone.ios .card, .phone.ios .navbar, .phone.ios .tray { background: var(--card); -webkit-backdrop-filter: blur(22px) saturate(1.9); backdrop-filter: blur(22px) saturate(1.9); border: 1px solid var(--rim); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px -10px rgba(0,0,0,.25); }
.phone.ios .sheet { background: var(--card2); -webkit-backdrop-filter: blur(28px) saturate(1.9); backdrop-filter: blur(28px) saturate(1.9); border-top: 1px solid var(--rim); }
/* Android: Material 3 Expressive */
.phone.android {
  --surface: #f8fcf4; --p-fg: #172116; --p-fg2: #47573f; --card: #eaf4e1; --card2: #f1f8ea; --rim: transparent;
  --line: #c6d8ba; --pri: #3a5f3a; --on-pri: #ffffff; --ton: #c8f6c8; --on-ton: #1d301d;
  --leer: #3a5f3a; --leer-bg: #90ee90; --on-leer: #1d301d; --danger: #ba1a1a; --ring: #1a73e8; --warn: #7a4b00;
  --r-out: 24px; --r-in: 6px; --pill-bg: #f1f8ea; --snack: #2a3a29; --on-snack: #eefcee; --snack-act: #90ee90;
}
.phone.android.dark {
  --surface: #101510; --p-fg: #e2ecdc; --p-fg2: #b7c8ad; --card: #1c261b; --card2: #253124;
  --line: #3d4f3a; --pri: #90ee90; --on-pri: #1d301d; --ton: #3a5f3a; --on-ton: #c8f6c8;
  --leer: #90ee90; --leer-bg: #3a5f3a; --on-leer: #c8f6c8; --danger: #ffb4ab; --ring: #8ab4ff; --warn: #ffcf8a;
  --pill-bg: #172017; --snack: #dfe9da; --on-snack: #1d301d; --snack-act: #3a5f3a;
}
.phone.android .screen { background: var(--surface); }
.phone.android .card { background: var(--card); }
.phone.android .navbar, .phone.android .tray { background: var(--card); }
.phone.android .sheet { background: var(--card2); }
.phone.android .fbtn:active, .phone.android .tbtn:active { border-radius: 10px; }
.phone :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

.sbar { display: flex; justify-content: space-between; padding: 12px 26px 4px; font-size: 14px; font-weight: 600; flex: 0 0 auto; }
.appbar { padding: 4px 14px 8px; flex: 0 0 auto; }
.appbar .r1 { display: flex; align-items: center; gap: 6px; min-height: 36px; }
.appbar .back { border: 0; background: none; color: var(--pri); padding: 6px 4px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; gap: 2px; }
.appbar .sp { flex: 1; }
.bchip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--ton); color: var(--on-ton); font-weight: 600; }
.bchip.bump { animation: bump .5s var(--spring, cubic-bezier(.34,1.45,.5,1)); }
@keyframes bump { 40% { transform: scale(1.15); } }
.appbar h1 { font-size: 28px; margin: 2px 4px 0; letter-spacing: -.015em; font-weight: 700; }
.phone.android .appbar h1 { font-weight: 500; font-size: 30px; }
.content { flex: 1 1 auto; overflow-y: auto; padding: 4px 14px 18px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }
.bottom { position: relative; flex: 0 0 auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.phone.android .bottom { padding: 0; gap: 0; }

.fbtn, .tbtn, .dbtn, .ghost { border: 0; border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 14px; transition: border-radius .2s; white-space: nowrap; }
.fbtn { background: var(--pri); color: var(--on-pri); }
.fbtn:disabled { opacity: .45; cursor: default; }
.tbtn { background: var(--ton); color: var(--on-ton); }
.dbtn { background: none; color: var(--danger); box-shadow: inset 0 0 0 1px currentColor; }
.ghost { background: none; color: var(--pri); padding: 8px 10px; }
.sm { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.ibtn { border: 0; background: none; color: var(--p-fg2); width: 40px; height: 40px; border-radius: 999px; display: inline-grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
.ibtn:hover { background: var(--ton); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 14px; height: 14px; }

.hint { font-size: 13px; color: var(--p-fg2); margin: 2px 4px 10px; }
.hint.warn { color: var(--warn); }
.sec { margin: 12px 0 0; }
.sec h3 { font-size: 13px; font-weight: 600; color: var(--p-fg2); margin: 0 4px 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--pill-bg); color: var(--p-fg); border-radius: 999px; padding: 5px 11px; min-height: 32px; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.pill.leer { background: var(--leer-bg); color: var(--on-leer); border-color: var(--leer); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.pill.onb .cart { display: inline-block; }
.cart { display: none; }
.pill.edit { padding: 0; gap: 0; cursor: default; animation: wiggle .9s ease-in-out infinite; }
.pill.edit:nth-child(2n) { animation-delay: -.45s; }
@keyframes wiggle { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
.pill.edit > button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: inherit; }
.pill.edit > button:first-child { padding: 5px 4px 5px 11px; min-height: 32px; }
.pill.edit > .px { padding: 0 9px 0 5px; min-height: 32px; color: var(--p-fg2); font-size: 14px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 4px var(--leer-bg); } 100% { box-shadow: 0 0 0 0 transparent; } }

.addbox { padding: 10px; border-radius: var(--r-out); margin: 2px 0 10px; }
.field { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 6px 0 14px; background: var(--pill-bg); border: 1px solid var(--line); }
.field input { flex: 1; min-width: 0; border: 0; background: none; color: var(--p-fg); padding: 10px 0; outline: none; }
.field:focus-within { border-color: var(--pri); box-shadow: 0 0 0 2px var(--ring); }
.sugg { list-style: none; margin: 8px 0 0; padding: 0; }
.srow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
.srow + .srow { border-top: 1px solid var(--line); }
.bimg { width: 30px; height: 30px; border-radius: 9px; background: var(--ton); color: var(--on-ton); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: 0 0 auto; }
.bimg.own { background: none; border: 1px dashed var(--line); color: var(--p-fg2); }
.st { flex: 1; min-width: 0; }
.st b { display: block; font-weight: 600; }
.st small { color: var(--p-fg2); font-size: 12px; }
.badge { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--p-fg2); white-space: nowrap; }
.dupc { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-radius: var(--r-out); margin: 0 0 10px; }
.dupc p { margin: 0; flex: 1; font-size: 13px; }

/* B: Zeilen */
.list { border-radius: var(--r-out); overflow: hidden; margin: 0 0 8px; }
.phone.android .list { background: none; display: flex; flex-direction: column; gap: 2px; }
.phone.android .list > .row { background: var(--card); border-radius: var(--r-in); }
.phone.android .list > .row:first-child { border-top-left-radius: var(--r-out); border-top-right-radius: var(--r-out); }
.phone.android .list > .row:last-child { border-bottom-left-radius: var(--r-out); border-bottom-right-radius: var(--r-out); }
.row { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 4px; min-height: 52px; }
.phone.ios .list > .row + .row { border-top: 1px solid var(--line); }
.rname { flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: inherit; padding: 6px 8px; cursor: pointer; border-radius: 12px; display: flex; align-items: center; gap: 4px; }
.rname > span { flex: 1; min-width: 0; }
.rname .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rname .s { display: block; font-size: 12px; color: var(--p-fg2); }
.rname .s.low { color: var(--warn); }
.rname .chev { color: var(--p-fg2); }
.okchip { border: 0; border-radius: 999px; background: var(--ton); color: var(--on-ton); padding: 5px 11px; min-height: 34px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.h2row { display: flex; align-items: baseline; justify-content: space-between; margin: 12px 4px 6px; }
.h2row h2 { font-size: 15px; margin: 0; }
.h2row small { color: var(--p-fg2); }
.disc { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 0; padding: 14px 16px; border-radius: var(--r-out); color: var(--p-fg); cursor: pointer; font-weight: 600; margin: 4px 0 8px; }
.disc svg { transition: transform .2s; }
.disc[aria-expanded="true"] svg { transform: rotate(180deg); }
.empty { padding: 14px 16px; border-radius: var(--r-out); color: var(--p-fg2); margin-bottom: 8px; }

/* C: Reiter + Kacheln */
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 999px; margin: 8px 0 0; }
.tabs button { flex: 1; border: 0; background: none; color: var(--p-fg); padding: 8px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--pri); color: var(--on-pri); }
.shead { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--p-fg2); padding: 6px 4px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; }
.shead .c { margin-left: auto; color: var(--leer); }
.shead svg { transition: transform .2s; }
.shead[aria-expanded="false"] svg { transform: rotate(-90deg); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 44px; border-radius: 14px; border: 1px solid var(--rim); color: var(--p-fg); text-align: left; cursor: pointer; font-size: 14px; }
.phone.android .tile { border: 0; border-radius: var(--r-in); }
.tile .dot { width: 20px; height: 20px; border-radius: 999px; flex: 0 0 auto; display: grid; place-items: center; background: var(--ton); color: var(--on-ton); }
.tile .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phone .screen .tile.leer { background: var(--leer-bg); color: var(--on-leer); }
.tile.leer .lb { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.tile.leer .dot { background: none; box-shadow: inset 0 0 0 2px var(--leer); }
.tile.leer .dot svg { display: none; }
.tile .cart { color: inherit; }
.tile.onb .cart { display: inline-block; }
.mrow { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 0; min-height: 52px; }
.phone.ios .list > .mrow + .mrow { border-top: 1px solid var(--line); }
.phone.android .list > .mrow { background: var(--card); border-radius: var(--r-in); }
.phone.android .list > .mrow:first-child { border-top-left-radius: var(--r-out); border-top-right-radius: var(--r-out); }
.phone.android .list > .mrow:last-child { border-bottom-left-radius: var(--r-out); border-bottom-right-radius: var(--r-out); }
.mrow .field { flex: 1; margin-left: 8px; }

/* Leiste unten */
.tray { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 22px; }
.phone.android .tray { border-radius: 0; border-top: 1px solid var(--line); }
.tray .tx { flex: 1; min-width: 0; font-size: 13px; }
.tray .tx b { display: block; font-size: 14px; }
.tray .tx span { color: var(--p-fg2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navbar { display: flex; justify-content: space-around; padding: 6px 4px; border-radius: 30px; }
.phone.android .navbar { border-radius: 0; padding: 8px 4px 14px; }
.navbar button { border: 0; background: none; color: var(--p-fg2); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 4px 6px; cursor: pointer; flex: 1; min-width: 0; }
.navbar button .ic { padding: 3px 16px; border-radius: 999px; display: grid; place-items: center; }
.navbar button[aria-current="page"] { color: var(--p-fg); font-weight: 700; }
.navbar button[aria-current="page"] .ic { background: var(--ton); color: var(--on-ton); }

/* Blatt + Hinweis */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 5; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,0,0,1); border-radius: 28px 28px 0 0; padding: 8px 18px 24px; z-index: 6; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
.sheet .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font-size: 20px; margin: 0 0 2px; outline: none; }
.sheet h3 { font-size: 13px; color: var(--p-fg2); margin: 14px 0 4px; font-weight: 600; }
.sheet .sub { color: var(--p-fg2); font-size: 13px; margin: 0 0 10px; }
.sheet .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.sheet .acts .dbtn { margin-right: auto; }
.clist { list-style: none; padding: 0; margin: 0; }
.crow { display: flex; align-items: center; gap: 12px; padding: 8px 2px; cursor: pointer; }
.crow input { width: 20px; height: 20px; accent-color: var(--pri); flex: 0 0 auto; }
.crow.dis { opacity: .55; cursor: default; }
.crow small { display: block; color: var(--p-fg2); font-size: 12px; }
.lbl { display: block; font-size: 12px; color: var(--p-fg2); margin: 6px 4px 4px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper output { min-width: 80px; text-align: center; font-weight: 600; }

const sinceText = it => { const [y, m] = it.since.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };

function groups(items) {

}

  return [...m.entries()].filter(([, v]) => v.length > 1);
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

    else if (n.length >= 4 && Math.abs(nn.length - n.length) <= 2 && lev(n, nn) <= (n.length > 7 ? 2 : 1)) sc = 3;

    else { sub = `reicht noch für ~${it.left} Znacht`; low = true; }
  } else sub = it.name !== it.bring ? it.name : "";
  const name = `<button type="button" class="rname" data-act="item" data-id="${it.id}"><span><span class="t">${esc(it.bring)}</span>${sub ? `<span class="s${low ? " low" : ""}">${esc(sub)}</span>` : ""}</span>${ICON.chev}</button>`;
  if (!top) return `<div class="row${fl(it)}">${name}<button type="button" class="tbtn sm" data-act="leer" data-id="${it.id}" aria-label="${esc(it.bring)} ist leer">leer</button></div>`;
  const bbtn = ob
    ? `<button type="button" class="okchip" data-act="unbring" data-id="${it.id}" aria-label="${esc(it.bring)} steht auf Bring! – wieder wegnehmen">${ICON.check}auf Bring!</button>`
    : `<button type="button" class="fbtn sm" data-act="bring" data-id="${it.id}">auf Bring!</button>`;
  return `<div class="row${fl(it)}">${name}<button type="button" class="ghost sm" data-act="da" data-id="${it.id}" aria-label="${esc(it.bring)} ist wieder da">da</button>${bbtn}</div>`;
}
function viewB() {
  const q = UI.qB.trim();
  let h = `<div class="field card" style="margin:2px 0 10px">${ICON.search}<input type="search" data-k="qB" value="${esc(UI.qB)}" placeholder="Suchen oder hinzufügen" aria-label="Suchen oder hinzufügen" autocomplete="off"></div>`;
  if (q) {
    const n = norm(q);
    const hits = S.items.filter(it => norm(it.bring).includes(n) || norm(it.name).includes(n));
    h += `<div class="h2row"><h2>Im Vorrat</h2><small>${hits.length}</small></div>`;
    h += hits.length ? `<div class="list card">${hits.map(it => rowB(it, it.status === "leer" || (it.left != null && it.left <= 2))).join("")}</div>` : `<div class="empty card">Nicht im Vorrat.</div>`;
    h += `<div class="h2row"><h2>Neu hinzufügen</h2><small>aus Bring!</small></div><div class="card addbox" id="sugg">${suggestHTML(q)}</div>`;
    return h;
  }
  const top = S.items.filter(it => it.status === "leer" || (it.left != null && it.left <= 2));
  const rest = S.items.filter(it => !top.includes(it));
  h += `<div class="h2row"><h2>Leer & bald leer</h2><small>${top.length}</small></div>`;
  h += top.length ? `<div class="list card">${top.map(it => rowB(it, true)).join("")}</div>` : `<div class="empty card">Alles da.</div>`;
  h += `<button type="button" class="disc card" data-act="rest" aria-expanded="${UI.openRest}"><span>Alles da · ${rest.length}</span>${ICON.down}</button>`;
  if (UI.openRest) {
    h += dupCard();
    for (const [sec, items] of groups(rest)) h += `<section class="sec"><h3>${esc(sec)}</h3><div class="list card">${items.map(it => rowB(it, false)).join("")}</div></section>`;
  }
  return h;
}

function viewC() {
  let h = "";
  if (UI.tab === "vorrat") {
    const tile = it => {
      const ob = onBring(it.bring), low = knapp(it);
      const use = it.use ? ` → ${Math.max(0, it.qty - it.use)}` : "";
      return `<button type="button" class="qt card${it.qty === 0 ? " zero" : low ? " low" : ""}${fl(it)}" data-act="qty" data-id="${it.id}" aria-label="${esc(it.bring)}, ${esc(fmt(it))}${ob ? ", steht auf Bring!" : ""}">
        <span class="n">${esc(it.bring)}${ob ? " " + ICON.cartV : ""}</span><span class="q">${esc(fmtShort(it))}${esc(use)}</span>${isOld(it) ? `<span class="old">seit ${esc(sinceText(it))}</span>` : ""}</button>`;
    };
    const cols = [
      ["knapp", "Knapp", S.items.filter(knapp), "Nichts knapp.", "2 oder weniger"],
      ["woche", "Diese Woche gebraucht", S.items.filter(it => !knapp(it) && it.use > 0), "Der Plan braucht nichts aus dem Vorrat.", "wird abgebucht"],
      ["da", "Alles da", S.items.filter(it => !knapp(it) && !it.use), "–", ""]
    ];
    h += `<div class="cbar"><button type="button" class="tbtn sm" data-act="cook">Woche kochen</button><span class="note">Kachel antippen = Menge ändern</span></div>`;
    h += cols.map(([k, t, list, none, hint]) => `<section class="sec col ${k}" aria-label="${t}"><h3><span>${t}</span><small>${list.length}${hint ? " · " + hint : ""}</small></h3>${list.length ? `<div class="grid3">${list.map(tile).join("")}</div>` : `<p class="none">${none}</p>`}</section>`).join("");
    return h;
  }
  {
    const [y, m] = S.inv.split("-").map(Number), [ny, nm] = NOW_YM.split("-").map(Number), due = (ny - y) * 12 + (nm - m) >= 12;
    h += `<div class="inv card${due ? " due" : ""}"><div class="tx"><b>Inventur</b><span>Letzte: ${MONTHS[m - 1]} ${y}${due ? " – fällig (einmal im Jahr)" : ""}. In der App unter Einstellungen.</span></div><button type="button" class="${due ? "fbtn" : "tbtn"}" data-act="clean">Inventur starten</button></div>`;
  }
  h += addBox("addC", "Artikel hinzufügen (wie in Bring!)") + dupCard();
  for (const [sec, items] of groups(S.items)) {
    h += `<section class="sec"><h3>${esc(sec)}</h3><div class="list card">`;
    for (const it of items) {
      if (UI.editing === it.id) {
        h += `<div class="mrow"><div class="field"><input data-k="ren-${it.id}" value="${esc(UI.renVal)}" aria-label="Neuer Name für ${esc(it.bring)}" autocomplete="off"></div><button type="button" class="fbtn sm" data-act="rename" data-id="${it.id}">OK</button><button type="button" class="ibtn" data-act="renCancel" aria-label="Abbrechen">${ICON.x}</button></div>`;
        h += `<p class="hint" id="rhint" style="margin:0 12px 8px">${renameHint(UI.renVal)}</p>`;
      } else {
        h += `<div class="mrow${fl(it)}"><button type="button" class="rname" data-act="ren" data-id="${it.id}" aria-label="${esc(it.bring)} umbenennen"><span><span class="t">${esc(it.bring)}</span>${it.name !== it.bring ? `<span class="s">${esc(it.name)}</span>` : ""}</span></button><button type="button" class="ibtn" data-act="del" data-id="${it.id}" aria-label="${esc(it.bring)} wegnehmen">${ICON.trash}</button></div>`;
      }
    }
    h += `</div></section>`;
  }
  return h;
}
function trayC() {
  if (UI.tab !== "vorrat") return "";
  const p = pending();
  if (!p.length) return "";
  return `<div class="tray"><div class="tx"><b>Für Bring! (${p.length}) · knapp</b><span>${esc(p.join(", "))}</span></div><button type="button" class="fbtn" data-act="sendC">Prüfen</button></div>`;
}

function infoHTML() {
  const d = INFO[V];
  return `<h2>${esc(d.title)}</h2><p>${esc(d.idea)}</p>
    <h3>So funktioniert es</h3><ul>${d.how.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <dl class="qa">${d.qa.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>
    <h3>Abwägen</h3><p class="pro"><b>Vorteil:</b> ${esc(d.pro)}</p><p class="pro"><b>Nachteil:</b> ${esc(d.con)}</p>
    <p class="try">${esc(d.tryit)}</p>`;
}
function bringHTML() {
  $("bCount").textContent = S.bring.length + " Artikel";
  $("bList").innerHTML = S.bring.map((b, i) => `<li class="${prevBring.has(b.name) ? "" : "new"}"><span class="n">${esc(b.name)}${b.spec ? `<small>${esc(b.spec)}</small>` : ""}</span><span class="by">${esc(b.by)}</span><button type="button" data-bi="${i}" aria-label="${esc(b.name)} in Bring! abhaken">Abhaken</button></li>`).join("") || `<li><span class="n muted">Liste leer</span></li>`;
  $("bLog").textContent = S.log || "";
  const grew = S.bring.some(b => !prevBring.has(b.name));
  prevBring = new Set(S.bring.map(b => b.name));
  return grew;
}

// ---------- Fokus erhalten ----------
function keyOf(el) {
  if (!el || !el.dataset) return null;
  if (el.dataset.k) return "k:" + el.dataset.k;
  if (el.dataset.act) return "a:" + el.dataset.act + ":" + (el.dataset.id || el.dataset.tab || el.dataset.sec || el.dataset.key || "");
  return null;
}
function restore(k) {
  if (!k) return false;
  const els = phone.querySelectorAll("[data-k],[data-act]");
  for (const el of els) if (keyOf(el) === k && !el.closest("[inert]")) { el.focus({ preventScroll: false }); return el; }
  return false;
}
function render() {
  const ae = document.activeElement;
  const k = UI.focusK || (phone.contains(ae) ? keyOf(ae) : null);
  const sel = ae && ae.dataset && ae.dataset.k && typeof ae.selectionStart === "number" ? ae.selectionStart : null;
  UI.focusK = null;
  const scroll = content.scrollTop;
  appbar.innerHTML = appbarHTML();
  content.innerHTML = V === "A" ? viewA() : V === "B" ? viewB() : viewC();
  tray.innerHTML = V === "A" ? trayA() : V === "C" ? trayC() : "";
  if (UI.sheetFn) { sheet.innerHTML = UI.sheetFn(); updateSend(); }
  content.scrollTop = scroll;
  const el = restore(k);
  if (el && sel != null && el.setSelectionRange) { try { el.setSelectionRange(sel, sel); } catch (e) { /* type=search */ } }
  if (bringHTML()) { const c = $("bchip"); if (c) c.classList.add("bump"); }
  if (UI.flash) { UI.flash = null; const f = content.querySelector(".flash"); if (f) f.scrollIntoView({ block: "nearest" }); }
}

// ---------- Ereignisse ----------
function onAct(b) {
  const a = b.dataset.act, id = b.dataset.id, it = id ? byId(id) : null;
  switch (a) {
    case "nav": snack("Nur Vorschau: hier geht es nur um den Grundvorrat."); break;
    case "edit": UI.edit = !UI.edit; render(); break;
    case "toggle": if (it) toggleLeer(it); break;
    case "item": openSheet(itemSheet(id), b); break;
    case "del": removeItem(id); break;
    case "close": closeSheet(); break;
    case "merge": openSheet(mergeSheet, b); break;
    case "mergeOne": act("Zusammengeführt", () => { mergeKey(b.dataset.key); if (UI.sheetFn && UI.sheetFn !== mergeSheet) closeSheet(true); }); break;
    case "mergeAll": act("Alle Doppelten zusammengeführt", () => { dupGroups().forEach(([k2]) => mergeKey(k2, true)); closeSheet(true); }); break;
    case "add": addItem(b.dataset.name); break;
    case "rename": {
      const inp = phone.querySelector(`[data-k="sheetName"]`) || phone.querySelector(`[data-k="ren-${id}"]`);
      renameItem(id, inp ? inp.value : ""); break;
    }
    case "ren": UI.editing = id; UI.renVal = it ? it.bring : ""; UI.focusK = "k:ren-" + id; render(); break;
    case "renCancel": { const e = UI.editing; UI.editing = null; UI.focusK = "a:ren:" + e; render(); break; }
    case "fillA": openFillA(b); break;
    case "sendC": openSendC(b); break;
    case "send": {
      const keys = [...sheet.querySelectorAll("[data-ck]:checked:not(:disabled)")].map(x => x.dataset.ck);
      const names = keys.map(x => x.slice(2));
      sendToBring(names, `${names.length} auf Bring! ✓`, V === "A");
      break;
    }
    case "leer": if (it) act(`${it.bring} ist leer`, () => { it.status = "leer"; UI.flash = it.id; }); break;
    case "da": if (it) act(`${it.bring} wieder da`, () => { it.status = "da"; it.left = null; }); break;
    case "bring": if (it) act(`${it.bring} auf Bring! ✓`, () => { S.bring.push({ name: it.bring, spec: "", by: "BringFrisch" }); S.log = `BringFrisch hat «${it.bring}» gesetzt.`; }); break;
    case "unbring": {
      if (!it) break;
      const e = bringEntry(it.bring);
      if (e && e.by !== "BringFrisch") { snack(`${e.by} hat ${it.bring} gesetzt – in Bring! abhaken`); break; }
      act(`${it.bring} von Bring! genommen`, () => { S.bring = S.bring.filter(x => x !== e); S.log = `BringFrisch hat «${it.bring}» wieder entfernt.`; });
      break;
    }
    case "rest": UI.openRest = !UI.openRest; render(); break;
    case "left-": case "left+": if (it) {
      const cur = it.left == null ? 6 : it.left;
      const nx = a === "left-" ? Math.max(0, cur - 1) : cur + 1;
      it.left = nx >= 6 ? null : nx; it.status = nx === 0 ? "leer" : (it.status === "leer" && nx > 0 ? "da" : it.status);
      render();
    } break;
    case "qty": openSheet(qtySheet(id), b); break;
    case "q-": case "q+": if (it) { setQty(it, it.qty + (a === "q+" ? 1 : -1)); render(); } break;
    case "qset": if (it) { setQty(it, +b.dataset.n); render(); } break;
    case "clean": UI.clean = 0; openSheet(cleanSheet, b); break;
    case "cleanSet": { const c = S.items[UI.clean]; if (c) setQty(c, +b.dataset.n); cleanNext(); break; }
    case "cleanSkip": cleanNext(); break;
    case "cook": {
      const used = S.items.filter(x => x.use > 0);
      act(`Woche gekocht: ${used.length} Artikel abgebucht`, () => used.forEach(x => setQty(x, x.qty - x.use)));
      break;
    }
    case "tab": UI.tab = b.dataset.tab; UI.editing = null; render(); break;
    case "coll": UI.coll[b.dataset.sec] = !UI.coll[b.dataset.sec]; render(); break;
  }
}
phone.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && phone.contains(b) && !b.disabled) onAct(b);
});
phone.addEventListener("change", e => { if (e.target.dataset.ck) updateSend(); });
phone.addEventListener("input", e => {
  const k = e.target.dataset.k; if (!k) return;
  if (k === "qB") { UI.qB = e.target.value; render(); }
  else if (k === "addA" || k === "addC") { UI[k] = e.target.value; const box = $("sugg"); if (box) box.innerHTML = suggestHTML(e.target.value); }
  else if (k === "sheetName" || k.startsWith("ren-")) {
    if (k === "sheetName") UI.sheetName = e.target.value; else UI.renVal = e.target.value;
    const h = $("rhint"); if (h) h.innerHTML = renameHint(e.target.value);
  }
});
phone.addEventListener("keydown", e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (e.key === "Escape") {
    if (UI.editing) { onAct({ dataset: { act: "renCancel" } }); e.preventDefault(); }
    else if (UI.sheetFn) { closeSheet(); e.preventDefault(); }
    return;
  }
  if (e.key !== "Enter" || !k) return;
  e.preventDefault();
  if (k === "addA" || k === "addC" || k === "qB") { const b = $("sugg") && $("sugg").querySelector('[data-act="add"]'); if (b) b.click(); }
  else if (k === "sheetName" || k.startsWith("ren-")) { const b = phone.querySelector('[data-act="rename"]'); if (b) b.click(); }
});
$("bList").addEventListener("click", e => {
  const b = e.target.closest("[data-bi]"); if (!b) return;
  const entry = S.bring[+b.dataset.bi]; if (!entry) return;
  S.bring.splice(+b.dataset.bi, 1);
  const hit = S.items.filter(it => norm(it.bring) === norm(entry.name));
  hit.forEach(it => { it.status = "da"; it.left = null; });
  S.log = `«${entry.name}» in Bring! abgehakt${hit.length ? " → im Vorrat wieder da" : ""}.`;
  if (V === "C" && hit.length) {
    const it = hit[0];
    setQty(it, it.qty + it.full); it.since = NOW_YM;
    S.log = `«${entry.name}» in Bring! abgehakt = gekauft → Vorrat +${pack(it)} (jetzt ${fmtShort(it)}).`;
  }
  render();
  const nb = $("bList").querySelector("[data-bi]"); if (nb) nb.focus();
});

// ---------- Umschalter ----------
function seg(id, attr, val) { $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val))); }
let OS = /android/i.test(navigator.userAgent) ? "android" : "ios";
let TH = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
function applyLook() {
  phone.className = `phone ${OS}${TH === "dark" ? " dark" : ""}`;
  document.documentElement.setAttribute("data-theme", TH);
  seg("segOS", "os", OS); seg("segT", "t", TH);
}
function setVariant(v) {
  V = v; seg("segV", "v", v);
  sheet.classList.remove("on"); scrim.classList.remove("on");
  ["appbar", "content", "bottom"].forEach(id => $(id).inert = false);
  fresh();
  $("snack").classList.remove("on");
  $("info").innerHTML = infoHTML();
  render();
  content.scrollTop = 0;
}
$("segV").onclick = e => { const b = e.target.closest("[data-v]"); if (b) setVariant(b.dataset.v); };
$("segOS").onclick = e => { const b = e.target.closest("[data-os]"); if (b) { OS = b.dataset.os; applyLook(); } };
$("segT").onclick = e => { const b = e.target.closest("[data-t]"); if (b) { TH = b.dataset.t; applyLook(); } };
$("reset").onclick = () => setVariant(V);

applyLook();
setVariant("A");
})();
</script>
